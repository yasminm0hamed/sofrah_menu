<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/bootstrap.css" />
  </head>
  <body>
    <div
      class="carousel container w-50 slide"
      id="slide"
      data-bs-ride="carousel"
      data-bs-pause="hover"
      data-bs-interval="2000"
    >
      <div class="carousel-indicators">
        <button
          type="button"
          data-bs-target="#slide"
          data-bs-slide-to="0"
          class="active"
        ></button>

        <button
          type="button"
          data-bs-target="#slide"
          data-bs-slide-to="1"
        ></button>

        <button
          type="button"
          data-bs-target="#slide"
          data-bs-slide-to="2"
        ></button>
      </div>

      <div class="carousel-inner">
        <div class="carousel-item active">
          <img
            src="WhatsApp Image 2026-09-18 at 11.06.41 AM.jpeg"
            alt=""
            class="w-100"
          />
        </div>

        <div class="carousel-item">
          <img
            src="WhatsApp Image 2026-09-18 at 1.04.05 PM.jpeg"
            alt=""
            class="w-100"
          />
        </div>

        <div class="carousel-item">
          <img src="photo_2026-09-09_17-23-13.jpg" alt="" class="w-100" />
        </div>
      </div>

      <button
        class="carousel-control-prev"
        type="button"
        data-bs-target="#slide"
        data-bs-slide="prev"
      >
        <span class="arrow">‹</span>
      </button>

      <button
        class="carousel-control-next"
        type="button"
        data-bs-target="#slide"
        data-bs-slide="next"
      >
        <span class="arrow">›</span>
      </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/popper.min.js"></script>
    <script src="js/jquery-4.0.0.js"></script>
    <script src="js/bootstrap.js"></script>
  </body>
</html>
